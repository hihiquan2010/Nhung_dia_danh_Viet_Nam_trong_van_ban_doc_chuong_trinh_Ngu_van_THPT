<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>CẦN GIUỘC - DỰ ÁN SÁNG TẠO SỐ</title>
  </head>
  <body>
    <header id="header"></header>
    <div class="header-section">
      <div class="title-wrapper">
        <span class="leaf-icon left-leaf">🌿</span>
        <h1 class="main-title">CẦN GIUỘC</h1>
        <span class="leaf-icon right-leaf">🌿</span>
      </div>
      <p class="sub-title"></p>
      <div class="divider-ornament">⚬❖⚬</div>
    </div>
    <div class="dia-danh-container">
      <div class="info-column">
        <div class="content-grid">
          <div class="map-box feature-box">
            <h3 class="box-title">
              <span class="icon"><i class="fa-solid fa-location-dot"></i></span>
              VỊ TRÍ TRÊN BẢN ĐỒ
            </h3>
            <div class="map-container">
              <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d61355.751211015835!2d106.68401449999999!3d10.6151425!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31753732ac23f117%3A0x5ceb5ebbd1eab8d!2zQ-G6p24gR2l14buZYywgTG9uZyBBbiwgVmnhu4d0IE5hbQ!5e1!3m2!1svi!2s!4v1788491073898!5m2!1svi!2s"
                width="100%"
                height="300"
                style="border: 0; border-radius: 10px"
                allowfullscreen=""
                loading="lazy"
              ></iframe>
            </div>
          </div>

          <div class="text-boxes">
            <div class="quote-box feature-box">
              <h3 class="box-title">
                <span class="icon">📖</span> TRÍCH DẪN VĂN BẢN
              </h3>
              <div class="quote-content">
                <p></p>
              </div>
            </div>

            <div class="role-box feature-box">
              <h3 class="box-title">
                <span class="icon"><i class="fa-solid fa-lightbulb"></i></span>
                VAI TRÒ CỦA ĐỊA DANH
              </h3>
              <ul class="role-list">
                <li>
                  <span class="check-icon"
                    ><i class="fa-solid fa-check"></i></span
                  >Không gian lịch sử của trận đánh đồn giặc của nhân dan Nam
                  Bộ.
                </li>
                <li>
                  <span class="check-icon"
                    ><i class="fa-solid fa-check"></i></span
                  >Biểu tượng của người dân áo vải.
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>

      <div class="image-column">
        <div class="image-header">
          <h3><span class="icon">📸</span> HÌNH ẢNH CẦN GIUỘC</h3>
          <div class="divider-ornament small">⚬❖⚬</div>
        </div>
        <div class="main-image-wrapper">
          <img
            src="../HÌNH NCKH 10-11-12/Cần Giuộc.png"
            alt="CẦN GIUỘC"
            class="full-image"
          />
          <p class="caption">
            <i class="fa-solid fa-circle-arrow-up"></i>
            <a
              href="https://baoxaydung.vn/xa-can-giuoc-phan-dau-la-trung-tam-kinh-te-nang-dong-cua-tinh-tay-ninh-192251006145950848.htm"
              style="text-decoration: none"
              >Nguồn : Xã Cần Giuộc phấn đấu là trung tâm kinh tế năng động của
              tỉnh Tây Ninh</a
            >
          </p>
        </div>
      </div>
    </div>

    <footer id="footer"></footer>
    <script type="module" src="./header_footer_fplaces.js"></script>
    <script src="../js/ico.js"></script>
  </body>
</html>
