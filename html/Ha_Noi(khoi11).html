<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>HÀ NỘI - DỰ ÁN SÁNG TẠO SỐ</title>
  </head>
  <body>
    <header id="header"></header>
    <div class="header-section">
      <div class="title-wrapper">
        <span class="leaf-icon left-leaf">🌿</span>
        <h1 class="main-title">HÀ NỘI</h1>
        <span class="leaf-icon right-leaf">🌿</span>
      </div>
      <p class="sub-title"></p>
      <div class="divider-ornament">⚬❖⚬</div>
    </div>
    <div class="dia-danh-container">
      <div class="info-column">
        <div class="content-grid">
          <div class="map-box feature-box">
            <h3 class="box-title">
              <span class="icon"><i class="fa-solid fa-location-dot"></i></span>
              VỊ TRÍ TRÊN BẢN ĐỒ
            </h3>
            <div class="map-container">
              <iframe
                src="https://www.google.com/maps?q=H%C3%A0%20N%E1%BB%99i&output=embed"
                width="100%"
                height="300"
                style="border: 0; border-radius: 10px"
                allowfullscreen=""
                loading="lazy"
              ></iframe>
            </div>
          </div>

          <div class="text-boxes">
            <div class="quote-box feature-box">
              <h3 class="box-title">
                <span class="icon">📖</span> TRÍCH DẪN VĂN BẢN
              </h3>
              <div class="quote-content">
                <p></p>
              </div>
            </div>

            <div class="role-box feature-box">
              <h3 class="box-title">
                <span class="icon"><i class="fa-solid fa-lightbulb"></i></span>
                VAI TRÒ CỦA ĐỊA DANH
              </h3>
              <ul class="role-list">
                <li>
                  <span class="check-icon"
                    ><i class="fa-solid fa-check"></i></span
                  >Các địa danh gắn liền với chặng đường đấu tranh tư tưởng giữ
                  cái cũ và cái mới, giữa hủ tục và phong trào giải phóng phụ
                  nữ.
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>

      <div class="image-column">
        <div class="image-header">
          <h3><span class="icon">📸</span> HÌNH ẢNH HÀ NỘI</h3>
          <div class="divider-ornament small">⚬❖⚬</div>
        </div>
        <div class="main-image-wrapper">
          <img
            src="../HÌNH NCKH 10-11-12/Hà Nội (Hồ Hoàn Kiếm).png"
            alt="HÀ NỘI"
            class="full-image"
          />
          <p class="caption">
            <i class="fa-solid fa-circle-arrow-up"></i> Nguồn : Do giáo viên
            cung cấp
          </p>
        </div>
      </div>
    </div>

    <footer id="footer"></footer>
    <script type="module" src="./header_footer_fplaces.js"></script>
    <script src="../js/ico.js"></script>
  </body>
</html>
