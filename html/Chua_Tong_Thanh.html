<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="./anim.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>CHÙA TÔNG THẠNH - DỰ ÁN SÁNG TẠO SỐ</title>
  </head>
  <body>
    <header id="header"></header>
    <div class="header-section">
      <div class="title-wrapper">
        <span class="title-icon left-leaf">🌿</span>
        <h1 class="main-title">CHÙA TÔNG THẠNH</h1>
        <span class="title-icon right-leaf">🌿</span>
      </div>
      <p class="sub-title"></p>
      <div class="divider-ornament">⚬❖⚬</div>
    </div>
    <div class="dia-danh-container">
      <div class="info-column">
        <div class="content-grid">
          <div class="map-box feature-box">
            <h3 class="box-title">
              <span class="icon"><i class="fa-solid fa-location-dot"></i></span>
              VỊ TRÍ TRÊN BẢN ĐỒ
            </h3>
            <div class="map-container">
              <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3834.855817552196!2d106.64640879999999!3d10.6054626!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x317536ba23f06d1f%3A0x8add65593c08d301!2zQ2jDuWEgVMO0biBUaOG6oW5o!5e1!3m2!1svi!2s!4v1788491188760!5m2!1svi!2s"
                width="100%"
                height="300"
                style="border: 0; border-radius: 10px"
                allowfullscreen=""
                loading="lazy"
              ></iframe>
            </div>
          </div>

          <div class="text-boxes">
            <div class="quote-box feature-box">
              <h3 class="box-title">
                <span class="icon">📖</span> TRÍCH DẪN VĂN BẢN
              </h3>
              <div class="quote-content">
                <p>
                  <strong>"</strong>Chùa Tông Thạnh năm canh ưng đóng lạnh, tấm
                  lòng son gửi lại bóng trăng rằm<strong>"</strong>
                </p>
              </div>
            </div>

            <div class="role-box feature-box">
              <h3 class="box-title">
                <span class="icon"><i class="fa-solid fa-lightbulb"></i></span>
                VAI TRÒ CỦA ĐỊA DANH
              </h3>
              <ul class="role-list">
                <li>
                  <span class="check-icon"
                    ><i class="fa-solid fa-check"></i></span
                  >Không gian hoài niệm và xót thương linh hồn nghĩa sĩ.
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>

      <div class="image-column">
        <div class="image-header">
          <h3><span class="icon">📸</span> HÌNH ẢNH CHÙA TÔNG THẠNH</h3>
          <div class="divider-ornament small">⚬❖⚬</div>
        </div>
        <div class="slider-container">
          <div class="rotator" style="--rotator-width: 270px">
            <span style="--i: 1; --total: 5">
              <img
                src="../HÌNH NCKH 10-11-12/Chùa Tông Thạnh 1.png"
                alt="Ảnh Chùa Tông Thạnh"
              />
            </span>

            <span style="--i: 2; --total: 5">
              <img
                src="../HÌNH NCKH 10-11-12/Chùa Tông Thạnh 2.png"
                alt="Ảnh Chùa Tông Thạnh"
              />
            </span>
            <span style="--i: 3; --total: 5">
              <img
                src="../HÌNH NCKH 10-11-12/Chùa Tông Thạnh 3.png"
                alt="Ảnh Chùa Tông Thạnh"
              />
            </span>

            <span style="--i: 4; --total: 5">
              <img
                src="../HÌNH NCKH 10-11-12/Chùa Tông Thạnh 4.png"
                alt="Ảnh Chùa Tông Thạnh"
              />
            </span>
            <span style="--i: 5; --total: 5">
              <img
                src="../HÌNH NCKH 10-11-12/Chùa Tông Thạnh 5.png"
                alt="Ảnh Chùa Tông Thạnh"
              />
            </span>
          </div>
        </div>
        <p class="caption">
          <i class="fa-solid fa-camera"></i>
          <a>Nguồn : Ảnh do giáo viên cung cấp</a>
        </p>
      </div>
    </div>

    <footer id="footer"></footer>
    <script type="module" src="./header_footer_fplaces.js"></script>
    <script src="../js/ico.js"></script>
  </body>
</html>
