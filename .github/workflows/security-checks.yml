name: Security checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Scan for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history for secrets
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir /repo \
            zricethezav/gitleaks:v8.30.1 \
            git --redact=100 --exit-code 1

  frontend-security:
    name: Scan frontend for security issues
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check JavaScript and HTML
        run: |
          set -o pipefail
          if ! docker run --rm \
            --entrypoint semgrep \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --workdir /src \
            semgrep/semgrep:1.185.0 \
            scan --config p/javascript --config p/security-audit \
            --metrics=off --json . 2>"$RUNNER_TEMP/semgrep.stderr" |
            python3 -c '
          import json
          import sys

          findings = json.load(sys.stdin).get("results", [])
          for finding in findings:
              line = finding.get("start", {}).get("line", "?")
              print("{} {}:{}".format(finding.get("check_id", "semgrep"), finding.get("path", "unknown"), line))
          print("Semgrep findings: {}".format(len(findings)))
          sys.exit(1 if findings else 0)
          '; then
            echo "::error::Semgrep failed or reported findings. Only rule IDs and locations are logged to avoid printing source or secret values."
            exit 1
          fi

  supabase-lint:
    name: Lint local Supabase database
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: Supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.1.0

      - name: Start local Supabase
        run: |
          if ! supabase start >"$RUNNER_TEMP/supabase-start.log" 2>&1; then
            echo "::error::Local Supabase failed to start. Output was withheld to avoid logging generated local keys."
            exit 1
          fi

      - name: Lint local database
        run: |
          if ! supabase db lint --local --fail-on warning >"$RUNNER_TEMP/supabase-lint.log" 2>&1; then
            echo "::error::Local Supabase database lint failed. Raw output was withheld to avoid exposing key-like values."
            exit 1
          fi
          echo "Local Supabase database lint passed."

      - name: Stop local Supabase
        if: always()
        run: |
          if ! supabase stop --no-backup >"$RUNNER_TEMP/supabase-stop.log" 2>&1; then
            echo "::warning::Could not stop the local Supabase stack."
          fi

  scope-summary:
    name: Report check coverage
    if: always()
    needs:
      - secrets
      - frontend-security
      - supabase-lint
    runs-on: ubuntu-24.04
    steps:
      - name: Summarize scope and limitations
        run: |
          {
            echo "## Security CI scope"
            echo
            echo "- Secret scanning covers repository history; values are redacted in scanner output."
            echo "- Semgrep scans code for known security patterns and reports rule IDs and locations only."
            echo "- Supabase lint runs against a disposable local stack; no production credentials or deployment are used."
            echo "- A public Supabase anon/publishable key is intended for client use; this workflow cannot prove that RLS policies are correctly configured on the hosted project."
            echo "- Static scans cannot guarantee the absence of all XSS, leaked secrets, runtime issues, or insecure production configuration."
          } >>"$GITHUB_STEP_SUMMARY"
